<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT companion setup</title>
  <desc id="desc">Three setup steps: install receiver, install userscript, enable Auto sync JSON to local.</desc>
  <rect width="980" height="330" fill="#f8fafc"/>
  <rect x="58" y="72" width="250" height="168" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="98" cy="112" r="20" fill="#2563eb"/>
  <text x="98" y="119" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">1</text>
  <text x="183" y="116" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Install receiver</text>
  <text x="183" y="156" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Local Python server</text>
  <text x="183" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Receives ChatGPT JSON</text>
  <rect x="365" y="72" width="250" height="168" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="405" cy="112" r="20" fill="#2563eb"/>
  <text x="405" y="119" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">2</text>
  <text x="490" y="116" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Install userscript</text>
  <text x="490" y="156" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Tampermonkey script</text>
  <text x="490" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Runs on chatgpt.com</text>
  <rect x="672" y="72" width="250" height="168" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="712" cy="112" r="20" fill="#2563eb"/>
  <text x="712" y="119" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">3</text>
  <text x="797" y="116" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Enable auto sync</text>
  <text x="797" y="156" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Set interval minutes</text>
  <text x="797" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">Keep ChatGPT open</text>
  <path d="M308 156h57" stroke="#2563eb" stroke-width="3"/>
  <path d="m357 148 12 8-12 8" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M615 156h57" stroke="#2563eb" stroke-width="3"/>
  <path d="m664 148 12 8-12 8" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="490" y="286" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#334155">After this, ChatGPT web JSON enters the same archive pipeline as other sources.</text>
</svg>
